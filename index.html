<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>證券市場大富翁</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- 事件視窗 Modal -->
<div id="event-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-header">
      <div id="modal-title" class="modal-title">事件</div>
      <div id="modal-sub" class="modal-sub"></div>
    </div>

    <div id="modal-body" class="modal-body"></div>

    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-ghost">略過</button>
      <button id="modal-ok" class="btn btn-primary">執行</button>
    </div>
  </div>
</div>

<body>

    <h1>📈 證券市場大富翁</h1>

    <div class="game-container">

        <!-- 棋盤 -->
        <!-- 棋盤 -->
        <div class="board" id="board">
            <!-- 股票螢幕：固定在棋盤中央（放在 tiles-container 之外） -->
            <div id="stock-screen" class="stock-screen"></div>

            <!-- 棋盤格子（6x6） -->
            <div id="tiles-container" class="tiles-container"></div>
        </div>




        <!-- 資訊區 -->
        <div class="info">
  <h2>玩家狀態</h2>

  <div class="info-grid">
    <!-- 左欄：玩家 -->
    <div>
      <div id="players"></div>
    </div>

    <!-- 右欄：決策紀錄 -->
    <div class="decision-panel">
      <h3>📋 決策紀錄</h3>
      <div id="decision-log" class="decision-log"></div>
    </div>
  </div>

  <div class="controls">
    <button onclick="rollDice()">🎲 擲骰</button>
    <button onclick="nextTurn()">▶ 下一回合</button>
    <button onclick="resetGame()">🔁 重置</button>
  </div>

  <div id="log" class="log"></div>
</div>


    </div>

    <script src="game.js"></script>
</body>

</html>
